[package]
name = "rust_inode_guard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "inode-guard"
path = "src/main.rs"

[dependencies]
thiserror = "2.0"

[dev-dependencies]
proptest = "1.5"
rstest = "0.23"
tempfile = "3.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

