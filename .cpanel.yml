---
deployment:
  tasks:
    # Target paths: Default to current user's cPanel home structure
    - export APPPATH=${APPPATH:-$HOME/supplierportal}
    - export WEBPATH=${WEBPATH:-$HOME/public_html}

    # Ensure application target directories exist
    - /bin/mkdir -p $APPPATH/app
    - /bin/mkdir -p $APPPATH/bootstrap/cache
    - /bin/mkdir -p $APPPATH/config
    - /bin/mkdir -p $APPPATH/database
    - /bin/mkdir -p $APPPATH/resources
    - /bin/mkdir -p $APPPATH/routes
    - /bin/mkdir -p $APPPATH/storage/app/private
    - /bin/mkdir -p $APPPATH/storage/framework/cache/data
    - /bin/mkdir -p $APPPATH/storage/framework/sessions
    - /bin/mkdir -p $APPPATH/storage/framework/views
    - /bin/mkdir -p $APPPATH/storage/logs

    # Deploy Laravel application source
    - /bin/cp -a app/. $APPPATH/app/
    - /bin/cp -a bootstrap/. $APPPATH/bootstrap/
    - /bin/cp -a config/. $APPPATH/config/
    - /bin/cp -a database/. $APPPATH/database/
    - /bin/cp -a resources/. $APPPATH/resources/
    - /bin/cp -a routes/. $APPPATH/routes/

    # Deploy root runtime files
    - /bin/cp artisan $APPPATH/artisan
    - /bin/cp composer.json $APPPATH/composer.json
    - /bin/cp composer.lock $APPPATH/composer.lock

    # Deploy tracked public assets and Vite build bundles
    # IMPORTANT: intentionally DO NOT overwrite public_html/index.php.
    - /bin/cp public/.htaccess $WEBPATH/.htaccess
    - /bin/cp public/favicon.ico $WEBPATH/favicon.ico
    - /bin/cp public/robots.txt $WEBPATH/robots.txt
    - /bin/mkdir -p $WEBPATH/assets
    - /bin/cp -a public/assets/. $WEBPATH/assets/
    - /bin/mkdir -p $WEBPATH/build
    - /bin/cp -a public/build/. $WEBPATH/build/