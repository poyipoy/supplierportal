<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Date Picker</title>
<style>
  :root{
    --ink:        #182238;
    --ink-soft:   #5b6478;
    --ink-faint:  #9aa2b3;
    --line:       #e6e9f0;
    --surface:    #ffffff;
    --canvas:     #f5f6fa;
    --accent:     #2f5eff;
    --accent-soft:#eaefff;
    --accent-ring:rgba(47,94,255,.18);
    --today-dot:  #ff7a3d;
    --radius-lg:  16px;
    --radius-md:  10px;
    --radius-sm:  8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 10%, #eef1fb 0%, transparent 45%),
      var(--canvas);
    font-family:var(--font);
    padding:40px 16px;
  }

  /* ============ Trigger input (context, so the picker has something to belong to) ============ */
  .field{
    position:relative;
    width:280px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:.01em;
  }
  .field-input{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:var(--radius-md);
    padding:10px 12px;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field-input:hover{ border-color:#c7cde0; }
  .field-input.open{
    border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-ring);
  }
  .field-input svg{ flex-shrink:0; color:var(--ink-faint); }
  .field-input span{ flex:1; }
  .field-input span.placeholder{ color:var(--ink-faint); }

  /* ============ Picker ============ */
  .picker{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    width:308px;
    background:var(--surface);
    border-radius:var(--radius-lg);
    border:1px solid var(--line);
    box-shadow:
      0 1px 2px rgba(20,24,43,.04),
      0 12px 32px -8px rgba(20,24,43,.16),
      0 24px 48px -24px rgba(20,24,43,.14);
    padding:18px 18px 10px;
    opacity:0;
    transform:translateY(-6px) scale(.98);
    pointer-events:none;
    transition:opacity .16s ease, transform .16s ease;
    z-index:20;
  }
  .picker.open{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }

  /* header row */
  .picker-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .picker-title{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .icon-btn{
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:none;
    border-radius:8px;
    color:var(--ink-faint);
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .icon-btn:hover{ background:var(--canvas); color:var(--ink); }
  .icon-btn:focus-visible, .field-input:focus-visible, .nav-btn:focus-visible, .day:focus-visible, .year-select:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  /* month/year nav */
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:2px;
  }
  .nav-btn{
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    background:var(--canvas);
    border:1px solid transparent;
    border-radius:9px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .nav-btn:hover{ background:var(--accent-soft); color:var(--accent); }
  .nav-btn:active{ transform:translateY(1px); }

  .month-year{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    cursor:pointer;
    padding:4px 10px;
    border-radius:9px;
    transition:background .12s ease;
  }
  .month-year:hover{ background:var(--canvas); }
  .month-label{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .year-label{
    font-size:12px;
    font-weight:600;
    color:var(--ink-faint);
  }

  /* year quick-picker (replaces the plain <select>) */
  .year-panel{
    display:none;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    padding:14px 2px 8px;
  }
  .year-panel.open{ display:grid; }
  .year-panel button{
    padding:9px 0;
    border-radius:8px;
    border:1px solid transparent;
    background:var(--canvas);
    color:var(--ink);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .year-panel button:hover{ background:var(--accent-soft); color:var(--accent); }
  .year-panel button.current{
    background:var(--accent);
    color:#fff;
  }

  /* weekday row */
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-top:12px;
    margin-bottom:4px;
  }
  .weekdays span{
    text-align:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--ink-faint);
    padding:4px 0;
  }

  /* day grid */
  .days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    row-gap:3px;
  }
  .day{
    position:relative;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto;
    width:36px;
    height:36px;
    font-size:13.5px;
    font-weight:500;
    color:var(--ink);
    background:transparent;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:background .12s ease, color .12s ease, transform .08s ease;
  }
  .day:hover:not(.disabled){ background:var(--canvas); }
  .day:active:not(.disabled){ transform:scale(.94); }
  .day.outside{ color:var(--ink-faint); font-weight:400; }
  .day.disabled{ color:#d3d7e2; cursor:not-allowed; }
  .day.today{
    color:var(--accent);
    font-weight:700;
  }
  .day.today::after{
    content:"";
    position:absolute;
    bottom:5px;
    width:4px; height:4px;
    border-radius:50%;
    background:var(--accent);
  }
  .day.selected{
    background:var(--accent);
    color:#fff;
    font-weight:700;
    box-shadow:0 4px 10px -2px var(--accent-ring);
  }
  .day.selected::after{ background:#fff; }
  .day.selected:hover{ background:var(--accent); }

  /* footer */
  .picker-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .link-btn{
    background:none;
    border:none;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    padding:6px 8px;
    border-radius:7px;
    transition:background .12s ease, color .12s ease;
  }
  .link-btn:hover{ background:var(--canvas); color:var(--ink); }
  .link-btn.primary{ color:var(--accent); }
  .link-btn.primary:hover{ background:var(--accent-soft); }
</style>
</head>
<body>

<div class="field">
  <label for="dateTrigger">Tanggal</label>
  <div class="field-input" id="dateTrigger" tabindex="0" role="button" aria-haspopup="dialog" aria-expanded="false">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
    <span id="dateTriggerText" class="placeholder">Pilih tanggal</span>
  </div>

  <div class="picker" id="picker" role="dialog" aria-label="Choose date">
    <div class="picker-head">
      <span class="picker-title">Choose date</span>
      <button class="icon-btn" id="closeBtn" aria-label="Tutup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="nav">
      <button class="nav-btn" id="prevMonth" aria-label="Bulan sebelumnya">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>

      <div class="month-year" id="monthYearToggle">
        <span class="month-label" id="monthLabel">August</span>
        <span class="year-label" id="yearLabel">2026</span>
      </div>

      <button class="nav-btn" id="nextMonth" aria-label="Bulan berikutnya">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>

    <div class="year-panel" id="yearPanel"></div>

    <div id="calendarBody">
      <div class="weekdays">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
      <div class="days" id="daysGrid"></div>
    </div>

    <div class="picker-foot">
      <button class="link-btn" id="todayBtn">Hari ini</button>
      <button class="link-btn primary" id="clearBtn">Bersihkan</button>
    </div>
  </div>
</div>

<script>
(function(){
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  let viewDate = new Date();     // month currently displayed
  let selectedDate = null;       // Date object once user picks
  const today = new Date();

  const trigger      = document.getElementById('dateTrigger');
  const triggerText   = document.getElementById('dateTriggerText');
  const picker        = document.getElementById('picker');
  const monthLabel    = document.getElementById('monthLabel');
  const yearLabel      = document.getElementById('yearLabel');
  const daysGrid       = document.getElementById('daysGrid');
  const yearPanel       = document.getElementById('yearPanel');
  const monthYearToggle = document.getElementById('monthYearToggle');
  const calendarBody    = document.getElementById('calendarBody');

  function isSameDay(a,b){
    return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  function render(){
    const year  = viewDate.getFullYear();
    const month = viewDate.getMonth();
    monthLabel.textContent = monthNames[month];
    yearLabel.textContent  = year;

    // Monday-first grid
    const firstOfMonth = new Date(year, month, 1);
    const startOffset  = (firstOfMonth.getDay() + 6) % 7; // 0 = Monday
    const daysInMonth   = new Date(year, month + 1, 0).getDate();
    const daysInPrev    = new Date(year, month, 0).getDate();

    let html = '';

    // trailing days of previous month
    for(let i = startOffset; i > 0; i--){
      html += `<button class="day outside disabled" disabled>${daysInPrev - i + 1}</button>`;
    }

    // days of current month
    for(let d = 1; d <= daysInMonth; d++){
      const thisDate = new Date(year, month, d);
      const classes = ['day'];
      if(isSameDay(thisDate, today)) classes.push('today');
      if(isSameDay(thisDate, selectedDate)) classes.push('selected');
      html += `<button class="${classes.join(' ')}" data-day="${d}">${d}</button>`;
    }

    // leading days of next month to fill the grid to a multiple of 7
    const totalCells = startOffset + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for(let d = 1; d <= trailing; d++){
      html += `<button class="day outside disabled" disabled>${d}</button>`;
    }

    daysGrid.innerHTML = html;

    daysGrid.querySelectorAll('.day:not(.disabled)').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        selectedDate = new Date(year, month, parseInt(btn.dataset.day, 10));
        updateTriggerText();
        render();
        closePicker();
      });
    });
  }

  function updateTriggerText(){
    if(selectedDate){
      const opts = { day:'2-digit', month:'long', year:'numeric' };
      triggerText.textContent = selectedDate.toLocaleDateString('id-ID', opts);
      triggerText.classList.remove('placeholder');
    } else {
      triggerText.textContent = 'Pilih tanggal';
      triggerText.classList.add('placeholder');
    }
  }

  function buildYearPanel(){
    const centerYear = viewDate.getFullYear();
    const startYear = centerYear - 4;
    let html = '';
    for(let y = startYear; y < startYear + 9; y++){
      html += `<button class="${y === centerYear ? 'current' : ''}" data-year="${y}">${y}</button>`;
    }
    yearPanel.innerHTML = html;
    yearPanel.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        viewDate = new Date(parseInt(btn.dataset.year,10), viewDate.getMonth(), 1);
        toggleYearPanel(false);
        render();
      });
    });
  }

  function toggleYearPanel(force){
    const willOpen = force !== undefined ? force : !yearPanel.classList.contains('open');
    if(willOpen) buildYearPanel();
    yearPanel.classList.toggle('open', willOpen);
    calendarBody.style.display = willOpen ? 'none' : '';
  }

  function openPicker(){
    picker.classList.add('open');
    trigger.classList.add('open');
    trigger.setAttribute('aria-expanded','true');
  }
  function closePicker(){
    picker.classList.remove('open');
    trigger.classList.remove('open');
    trigger.setAttribute('aria-expanded','false');
    toggleYearPanel(false);
  }

  trigger.addEventListener('click', ()=>{
    picker.classList.contains('open') ? closePicker() : openPicker();
  });
  trigger.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPicker(); }
  });

  document.getElementById('closeBtn').addEventListener('click', closePicker);

  document.getElementById('prevMonth').addEventListener('click', ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
    render();
  });

  monthYearToggle.addEventListener('click', ()=> toggleYearPanel());

  document.getElementById('todayBtn').addEventListener('click', ()=>{
    viewDate = new Date();
    selectedDate = new Date();
    updateTriggerText();
    render();
  });
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    selectedDate = null;
    updateTriggerText();
    render();
  });

  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.field')) closePicker();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') closePicker();
  });

  render();
})();
</script>

</body>
</html>
