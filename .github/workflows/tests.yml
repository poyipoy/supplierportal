name: Tests

# Two layers:
#  - php + node run on every PR and master push: the fast isolation/auth/asset
#    subset plus the core Import and Local/Finance workflow suites.
#  - deep runs the whole PHPUnit suite (Parallel, then the Serial concurrency
#    and migration tests) against MySQL 8.0 and MariaDB 11.4 (production
#    engine) on master pushes, nightly and on demand.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 19 * * *" # 02:00 Asia/Jakarta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: adasi_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, bcmath, mbstring, zip, intl, gd, fileinfo, xmlreader, dom
          coverage: none
      # Composer's post-autoload-dump runs `artisan package:discover`, which boots
      # the app. Without an .env the app defaults to production and its HASHIDS_SALT
      # and finance guards abort, so the non-production test env must exist first.
      # .env.example is a production template and would trip the same guards.
      - name: Prepare environments
        run: |
          cp .env.testing.example .env
          cp .env.testing.example .env.testing
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate application keys
        run: |
          php artisan key:generate --no-interaction
          php artisan key:generate --env=testing --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build assets (feature tests render @vite and need the manifest)
        run: |
          npm ci
          npm run build
      - name: Pint (changed PHP files)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.php')
          if [ -n "$files" ]; then vendor/bin/pint --test $files; fi
      - name: Regression subset
        run: >-
          php artisan test
          tests/Feature/TestingEnvironmentDatabaseSafetyTest.php
          tests/Feature/SupplierDataIsolationTest.php
          tests/Feature/LocalInvoice/LocalInvoiceScopeIsolationTest.php
          tests/Feature/HashidUrlSecurityTest.php
          tests/Feature/SupplierScopeMemoTest.php
          tests/Feature/Auth
          tests/Feature/SupplierRegistration
          tests/Feature/LocalInvoice/LocalProcurementCommitRevalidationTest.php
          tests/Feature/LocalInvoice/LocalProcurementCommitBudgetTest.php
          tests/Feature/LocalInvoice/LocalProcurementBackgroundImportTest.php
          tests/Feature/LocalInvoice/LocalPoLatestDocumentListTest.php
          tests/Feature/Finance/FinanceDashboardEquivalenceTest.php
          tests/Feature/PaymentForecastAndReportingTest.php
          tests/Feature/NotificationSummaryEquivalenceTest.php
          tests/Feature/ConversationHistoryPaginationTest.php
          tests/Feature/UiIconComponentTest.php
          tests/Feature/RenderedComponentTest.php
          tests/Feature/FrontendAssetLoadingTest.php
          tests/Feature/ProfileCriticalPathsCommandTest.php
          tests/Feature/LocalizationPerformanceTest.php
          tests/Unit/TranslationParityTest.php
          tests/Unit/UserFacingCopyInventoryTest.php
      # Business invariants of both cores: quotation review, item awards, PO
      # generation, shipments, QC, claims, document access; invoice submission,
      # physical receipt, Section A/B, Ready to Pay (including the two-connection
      # race on the authoritative approval path), DRP, voucher, settlement, GA.
      - name: Core workflow suites
        run: >-
          php artisan test
          tests/Feature/Procurement/QuotationReviewInvariantTest.php
          tests/Feature/QuotationAvailabilityTest.php
          tests/Feature/QuotationDirectPoGenerationTest.php
          tests/Feature/ItemLevelAwardTest.php
          tests/Feature/ItemLevelPoGenerationTest.php
          tests/Feature/PriceComparisonItemAwardTest.php
          tests/Feature/Purchasing/SplitAwardPoGenerationTest.php
          tests/Feature/PurchaseOrderCreationConcurrencyAndInvariantTest.php
          tests/Feature/ShipmentAndPartialDeliveryTest.php
          tests/Feature/ShipmentDocumentsAndQcIntegrationTest.php
          tests/Feature/Qc/QcInspectionAttachmentCompensationTest.php
          tests/Feature/MaterialClaimSecurityAndUiTitleTest.php
          tests/Feature/AttachmentAuthorizationBoundaryTest.php
          tests/Feature/NotificationDeliveryTest.php
          tests/Feature/LocalInvoiceSubmissionV2Test.php
          tests/Feature/CashierReceiptAndExpiryTest.php
          tests/Feature/FinanceVerificationV2Test.php
          tests/Feature/LocalInvoice/LocalInvoiceConcurrencyTest.php
          tests/Feature/LocalInvoice/LocalSupplierWholeGrSettlementTest.php
          tests/Feature/UnifiedPaymentEngineTest.php
          tests/Feature/FinanceDrpPaidTest.php
          tests/Feature/Finance/BusinessRuleRefusalHttpTest.php
          tests/Feature/Finance/FinancialSecurityControlsTest.php
          tests/Feature/Finance/PaymentBatchSettlementTest.php
          tests/Feature/GaClaimWorkflowTest.php

  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # po-progress-history and regional-export-history resolve translation keys
      # through `php -r "require 'vendor/autoload.php'; ..."`. They only need the
      # Composer autoloader, so scripts (package:discover, app boot) are skipped.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring
          coverage: none
      - name: Install PHP autoloader for PHP-backed JS tests
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JavaScript tests
        run: node --test tests/js/*.test.mjs
      - name: Build assets
        run: npm run build

  deep:
    name: deep (${{ matrix.engine }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql-8.0
            image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1
          # Production runs MariaDB 11.4 (docs/guides/CPANEL-PERFORMANCE-RUNTIME.md);
          # the app connects with the mysql driver, as .env.example does.
          - engine: mariadb-11.4
            image: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: adasi_portal_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: adasi_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, bcmath, mbstring, zip, intl, gd, fileinfo, xmlreader, dom
          coverage: none
      - name: Prepare environments
        run: |
          cp .env.testing.example .env
          cp .env.testing.example .env.testing
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate application keys
        run: |
          php artisan key:generate --no-interaction
          php artisan key:generate --env=testing --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build assets
        run: |
          npm ci
          npm run build
      - name: Record the database engine under test
        run: php -r 'echo (new PDO("mysql:host=127.0.0.1;port=3306", "root", ""))->query("SELECT VERSION()")->fetchColumn(), PHP_EOL;'
      - name: Full suite, parallel part
        run: php artisan test --parallel --processes=4 --testsuite=Parallel
      # The Serial suite holds the multi-connection row-lock tests and the
      # migration/rollback tests; run it even when the parallel part failed.
      - name: Full suite, serial part (concurrency and migrations)
        if: success() || failure()
        run: php artisan test --testsuite=Serial
